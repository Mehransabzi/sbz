{% if page_obj.has_other_pages %}<nav class="cp-pagination">{% if page_obj.has_previous %}<a href="?visibility={{ visibility|default:'all'|urlencode }}&q={{ query|urlencode }}&sort={{ sort|default:''|urlencode }}&page={{ page_obj.previous_page_number }}">صفحه قبل</a>{% endif %}<span>صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?visibility={{ visibility|default:'all'|urlencode }}&q={{ query|urlencode }}&sort={{ sort|default:''|urlencode }}&page={{ page_obj.next_page_number }}">صفحه بعد</a>{% endif %}</nav>{% endif %}
