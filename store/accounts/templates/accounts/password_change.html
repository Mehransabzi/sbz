{% extends 'storefront/base.html' %}{% block title %}تغییر رمز عبور{% endblock %}{% block content %}<section class="account-page wrap"><div class="account-card"><h1>تغییر رمز عبور</h1><p class="muted">رمز فعلی حساب را وارد کنید و یک رمز تازه انتخاب کنید.</p><form method="post" class="account-form">{% csrf_token %}{% for field in form %}<label class="form-field"><span>{{ field.label }}</span>{{ field }}{% if field.errors %}<small class="field-error">{{ field.errors|join:', ' }}</small>{% endif %}{% if field.help_text %}<small class="field-help">{{ field.help_text|safe }}</small>{% endif %}</label>{% endfor %}<button class="button button-primary" type="submit">ذخیره رمز تازه</button></form></div></section>{% endblock %}
